repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy type check
        entry: uv run mypy agentsflow tests
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: pyright type check
        entry: uv run pyright agentsflow tests
        language: system
        types: [python]
        pass_filenames: false

      - id: uv-lock-check
        name: uv lock --frozen
        entry: uv lock --frozen
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
