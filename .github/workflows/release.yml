name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0). Required for manual runs."
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_version.outputs.tag }}
      package_version: ${{ steps.tag_version.outputs.package_version }}
    env:
      UV_LINK_MODE: copy
    steps:
      # Fetch full history so tags are present for version validation.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install uv and Python 3.12 for reproducible builds.
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-path: uv.lock

      # Resolve tag from dispatch input or ref and read package version for validation/outputs.
      - name: Resolve tag and package version
        id: tag_version
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          TAG=""
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [[ "${EVENT_NAME}" == "push" && "${REF}" == refs/tags/* ]]; then
            TAG="${REF_NAME}"
          else
            echo "No tag found. Provide a tag via workflow_dispatch input (e.g., v0.1.0) or run on a tag ref."
            exit 1
          fi

          if [[ "${TAG}" != v* ]]; then
            echo "Tag ${TAG} must start with 'v'."
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} does not exist in the repository. Ensure the tag is pushed before running the workflow."
            exit 1
          fi

          git -c advice.detachedHead=false checkout "refs/tags/${TAG}"

          PACKAGE_VERSION=$(python - <<'PY'
import tomllib
from pathlib import Path

data = tomllib.loads(Path("pyproject.toml").read_text())
print(data["project"]["version"])
PY
)

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG}, package_version=${PACKAGE_VERSION}"

      # Fail fast if the tag (v*) does not match the package version.
      - name: Validate tag matches package version
        env:
          TAG: ${{ steps.tag_version.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.tag_version.outputs.package_version }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${TAG} does not match package version ${EXPECTED_TAG}"
            exit 1
          fi
          echo "Tag ${TAG} matches package version ${PACKAGE_VERSION}"

      # Install only runtime dependencies to keep the release job lean.
      - name: Install dependencies
        run: uv sync --frozen

      # Build the wheel and sdist artifacts.
      - name: Build package
        run: uv build

      # Publish to PyPI with trusted publishing and duplicate checks for idempotency.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple
