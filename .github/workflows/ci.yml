name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  lint-test-build:
    name: Lint, Test, Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      - name: Lint
        run: uv run --extra dev ruff check

      - name: Test
        run: uv run --extra dev pytest --junitxml=artifacts/pytest-${{ matrix.os }}.xml

      - name: Build
        run: uv build

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: artifacts/pytest-${{ matrix.os }}.xml
          if-no-files-found: warn

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
          if-no-files-found: warn
