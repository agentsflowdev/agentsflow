site_name: AgentsFlow
site_description: Documentation for operating and contributing to AgentsFlow.
site_url: https://docs.agentsflow.dev
repo_name: agentsflowdev/agentsflow
repo_url: https://github.com/agentsflowdev/agentsflow

nav:
  - Home: index.md
  - Guides:
      - Quickstart: guides/quickstart.md
      - Deployment: guides/deployment.md
      - Upgrade Notes: guides/upgrades.md
      - Providers: guides/providers.md
  - Workflows:
      - Process Workflow: workflows/process.md
  - Operations:
      - Runbooks: ops/runbooks.md
  - Configuration:
      - Environment Variables: configuration/env.md
  - Contributing:
      - Codebase Tour: contributing/codebase-tour.md
      - Dev Setup: contributing/dev-setup.md
      - Testing: contributing/testing.md
  - Reference:
      - CLI & Worker: reference/cli.md
      - MCP Server: reference/mcp.md
      - API (mkdocstrings): reference/api.md
  - Changelog: changelog.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - content.code.copy
  language: en

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google
            separate_signature: true
            line_length: 120
  - mike

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  version:
    provider: mike
    default: latest
