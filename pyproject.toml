[project]
name = "agentsflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.18.0",
    "gitpython>=3.1.43",
    "jira>=3.8.0",
    "pygithub>=2.5.0",
    "agent-client-protocol>=0.6.2",
    "pydantic-ai-slim[temporal,openai]>=1.9.1",
    "pydantic-settings>=2.4.0",
    "logfire>=4.14.2",
    "fastmcp>=2.13.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.setuptools.packages.find]
include = ["agentsflow*"]
