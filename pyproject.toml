[project]
name = "agentsflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.18.0",
    "gitpython>=3.1.43",
    "jira>=3.8.0",
    "agent-client-protocol>=0.6.2",
    "pydantic-ai-slim[temporal,openai]>=1.9.1",
    "pydantic-settings>=2.4.0",
    "logfire>=4.14.2",
    "fastmcp>=2.13.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# ACP Client protocol requires camelCase method names, ternary simplification less readable
"agentsflow/activities/claude_acp.py" = ["N802", "SIM108"]
# Long prompt strings are acceptable in workflow and agent definitions
"agentsflow/workflows/sdlc.py" = ["E501", "E402"]
"agentsflow/workflows/sdlc_agents.py" = ["E501"]
# Test files can have longer lines for test data
"tests/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
# Exclude tests from type checking
exclude = ["tests/"]

# Allow missing imports for third-party libraries without type stubs
[[tool.mypy.overrides]]
module = "jira.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "acp.*"
ignore_missing_imports = true

# Relaxed checking for files using third-party libraries without type stubs
[[tool.mypy.overrides]]
module = "agentsflow.activities.claude_acp"
warn_unused_ignores = false
disallow_subclassing_any = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "agentsflow.activities.jira"
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "agentsflow.workflows.sdlc"
warn_return_any = false
# Pydantic-ai agent outputs can be complex types
disable_error_code = ["assignment", "union-attr", "arg-type"]

[[tool.mypy.overrides]]
module = "agentsflow.workflows.sdlc_agents"
# Pydantic-ai Agent type signature is complex
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "agentsflow.mcp_server"
# SimpleNamespace vs Namespace compatibility
disable_error_code = ["arg-type"]
